name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the private-content lint scans every commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: content/.vitepress/package-lock.json
      - name: Fonts for measured text tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk
      - run: make setup
      - name: make check (same command as local development)
        env:
          # Optional repository secret: one private term per line. Never commit the list.
          PRIVATE_NAMES: ${{ secrets.ARCHATLAS_PRIVATE_NAMES }}
        run: |
          if [ -n "$PRIVATE_NAMES" ]; then
            printf '%s\n' "$PRIVATE_NAMES" > "$RUNNER_TEMP/private-names.txt"
            export ARCHATLAS_PRIVATE_NAMES_FILE="$RUNNER_TEMP/private-names.txt"
          fi
          make check PACK_OUT="$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: content/.vitepress/dist
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: skill-zip
          path: ${{ runner.temp }}/dist
          retention-days: 7
