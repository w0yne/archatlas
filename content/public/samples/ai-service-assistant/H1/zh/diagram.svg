  <text x="42" y="700" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#1F2937" data-owner="raci-5-0" data-role="sub">负责发布 / 恢复决策</text>
  <rect x="438" y="670" width="320" height="108" fill="#ffffff" stroke="#3D6FB2" stroke-width="1" data-role="cell" data-id="raci-5-1" />
  <text x="452" y="700" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937" data-owner="raci-5-1" data-role="sub">I</text>
  <rect x="758" y="670" width="320" height="108" fill="#ffffff" stroke="#3D6FB2" stroke-width="1" data-role="cell" data-id="raci-5-2" />
  <text x="772" y="700" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937" data-owner="raci-5-2" data-role="sub">A</text>
  <rect x="1078" y="670" width="320" height="108" fill="#ffffff" stroke="#3D6FB2" stroke-width="1" data-role="cell" data-id="raci-5-3" />
  <text x="1092" y="700" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937" data-owner="raci-5-3" data-role="sub">R</text>
  <text x="28" y="845" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">R = 共享事实明确的执行角色。A = 最终负责；C = 提供意见；I = 接收通知。</text>
  <text x="28" y="885" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">A/R 可为同一角色；C 在重要变更前提供意见；I 仅接收脱敏结果。</text>
  <text x="28" y="925" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">AS-raci 定义示意职责；A 不授予数据面权限，也不替代逐请求工具审批。</text>
  <text x="28" y="965" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">发布/恢复：知识管理员 A，平台运维员 R；只晋级已批准且通过门禁的配置。</text>
</svg>
