  <text x="28" y="845" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">R = execution role stated in frozen facts. A = accountable; C = consulted; I = informed.</text>
  <text x="28" y="885" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">A/R may be one role; C contributes before material changes; I receives redacted outcomes.</text>
  <text x="28" y="925" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">AS-raci defines illustrative duties; A grants no data-plane rights and does not replace per-request tool approval.</text>
  <text x="28" y="965" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">Release/recovery: steward A, operator R; promote only the approved, evaluated configuration.</text>
