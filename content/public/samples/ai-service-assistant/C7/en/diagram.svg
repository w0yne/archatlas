<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" lang="en" data-archatlas="0.1">
  <title>C7 · Enterprise Service Assistant — context map (bounded contexts, illustrative)</title>
  <desc>Fictional teaching design, scenario version 2; additional parameters are illustrative assumptions. Fictional target · Five contexts; relationship patterns are teaching proposals for this design</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4B5563" />
    </marker>
  </defs>
  <rect data-role="canvas" width="1400" height="960" fill="#ffffff" />
  <text x="28" y="40" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#1F2937">C7 · Enterprise Service Assistant — context map (bounded contexts, illustrative)</text>
  <text x="28" y="72" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937">Fictional target · Five contexts; relationship patterns are teaching proposals for this design</text>
  <text x="40" y="112" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#1F2937">Direction = influence: upstream → downstream. Data flows both ways on every line.</text>
  <rect x="120" y="250" width="260" height="108" data-role="node" data-id="X-idp" data-kind="external" fill="#EDEDED" stroke="#666A73" stroke-width="1.8" rx="0" />
  <text x="134" y="279" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="X-idp" data-role="name">Enterprise IdP / AS</text>
  <text x="134" y="304" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-idp" data-role="sub">X-idp · OIDC / OAuth</text>
  <text x="134" y="327" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-idp" data-role="sub">Identity, delegation</text>
  <rect x="420" y="250" width="260" height="108" data-role="node" data-id="X-doc" data-kind="external" fill="#EDEDED" stroke="#666A73" stroke-width="1.8" rx="0" />
  <text x="434" y="279" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="X-doc" data-role="name">Document Repository</text>
  <text x="434" y="304" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-doc" data-role="sub">X-doc · HTTPS connector</text>
  <text x="434" y="327" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-doc" data-role="sub">Documents, access policy</text>
  <rect x="720" y="250" width="260" height="108" data-role="node" data-id="X-desk" data-kind="external" fill="#EDEDED" stroke="#666A73" stroke-width="1.8" rx="0" />
  <text x="734" y="279" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="X-desk" data-role="name">Service Desk</text>
  <text x="734" y="304" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-desk" data-role="sub">X-desk · HTTPS</text>
  <text x="734" y="327" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-desk" data-role="sub">Catalogue, tickets</text>
  <rect x="1020" y="250" width="260" height="108" data-role="node" data-id="X-model" data-kind="external" fill="#EDEDED" stroke="#666A73" stroke-width="1.8" rx="0" />
  <text x="1034" y="279" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="X-model" data-role="name">Managed Model Service</text>
  <text x="1034" y="304" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-model" data-role="sub">X-model · Amazon Bedrock</text>
  <text x="1034" y="327" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-model" data-role="sub">Text, embeddings</text>
  <rect x="200" y="520" width="1000" height="140" data-role="node" data-id="S-assistant" data-kind="system" fill="#1767B5" stroke="#03172E" stroke-width="2.4" rx="8" />
  <text x="214" y="549" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#ffffff" data-owner="S-assistant" data-role="name">Enterprise Service Assistant</text>
  <text x="214" y="574" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#ffffff" data-owner="S-assistant" data-role="sub">S-assistant · new application</text>
  <text x="214" y="597" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#ffffff" data-owner="S-assistant" data-role="sub">Cited answers and approved service actions</text>
  <text x="40" y="730" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937">Upstream roles: OHS Open Host Service · PL Published Language.   Downstream roles: CF Conformist · ACL Anticorruption Layer.</text>
  <text x="40" y="762" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937">Reading: the assistant conforms to the identity and model contracts (CF) and translates tool calls and document access rules (ACL).</text>
  <text x="40" y="794" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937">The patterns are proposals for this fictional design, not findings about real systems.</text>
  <polyline points="250,358 250,520" data-role="edge" data-id="CTX-1" data-from="X-idp" data-to="S-assistant" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="257.0" y="425.0" width="107.296875" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-CTX-1" data-parent="CTX-1" />
  <text x="262" y="445" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" data-owner="CTX-1" data-role="edge-label">OHS/PL → CF</text>
  <polyline points="550,358 550,520" data-role="edge" data-id="CTX-2" data-from="X-doc" data-to="S-assistant" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="557.0" y="425.0" width="93.265625" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-CTX-2" data-parent="CTX-2" />
  <text x="562" y="445" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" data-owner="CTX-2" data-role="edge-label">OHS → ACL</text>
  <polyline points="850,358 850,520" data-role="edge" data-id="CTX-3" data-from="X-desk" data-to="S-assistant" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="857.0" y="425.0" width="93.265625" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-CTX-3" data-parent="CTX-3" />
  <text x="862" y="445" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" data-owner="CTX-3" data-role="edge-label">OHS → ACL</text>
  <polyline points="1150,358 1150,520" data-role="edge" data-id="CTX-4" data-from="X-model" data-to="S-assistant" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="1157.0" y="425.0" width="107.296875" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-CTX-4" data-parent="CTX-4" />
  <text x="1162" y="445" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" data-owner="CTX-4" data-role="edge-label">OHS/PL → CF</text>
  <rect x="28" y="860" width="42" height="22" data-role="legend-swatch" data-id="__legend-swatch-1" fill="#EDEDED" stroke="#666A73" stroke-width="1.8" rx="0" />
  <text x="82" y="877" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-1">External context</text>
  <rect x="473" y="860" width="42" height="22" data-role="legend-swatch" data-id="__legend-swatch-2" fill="#1767B5" stroke="#03172E" stroke-width="2.4" rx="8" />
  <text x="527" y="877" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-2">Subject context</text>
  <polyline points="918,870 960,870" data-role="edge" data-kind="legend" data-id="legend-line-3" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="972" y="877" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-3">Upstream → downstream (influence)</text>
</svg>
