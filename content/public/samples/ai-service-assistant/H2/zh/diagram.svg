<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1360" lang="zh" data-archatlas="0.1">
  <title>H2 · 脱敏服务证据 — 可观测性</title>
  <desc>虚构教学设计，场景版本2；补充参数为示意假设。示意：源端脱敏的健康与成本证据；目标、采样、保留及告警见 AS-observe。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4B5563" />
    </marker>
  </defs>
  <rect data-role="canvas" width="1520" height="1360" fill="#ffffff" />
  <text x="28" y="40" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#1F2937">H2 · 脱敏服务证据 — 可观测性</text>
  <text x="28" y="72" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937">示意：源端脱敏的健康与成本证据；目标、采样、保留及告警见 AS-observe。</text>
  <rect x="25" y="120" width="590" height="1075" data-role="group" data-id="OBS-source" data-kind="boundary" fill="#F3F8FF" stroke="#3D6FB2" stroke-width="1.6" rx="10" />
  <text x="43" y="152" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937" data-owner="OBS-source" data-role="group-title">已有运行单元与队列来源</text>
