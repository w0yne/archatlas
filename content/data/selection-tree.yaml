# Decision tree for choosing a diagram type: source for
# tools/build_selection.py. Top-level branch ids are the `facets.asks` keys in
# types.yaml; every type listed under a branch must carry that facet, and the
# leaves together must reach every type.
#
# Leaf fields: when {en, zh} (the reader's need), types [codes, best first],
# optional hint {en, zh} (how to pick between the listed types).

version: 1

# Reader-specific recommendations, not changes to the catalogue's taxonomy.
# Cross-facet leaves require a bilingual rationale. Overrides are intentional
# teaching defaults; aliases/terms below are merged by name into reader output.
common_requests:
  - request: {en: "Onboard a developer", zh: "让新开发者了解系统"}
    first: C2
    next: [C3, E1]
    note: {en: "Start with the system and its neighbours; then show running parts and one request.", zh: "先看系统与周边，再看运行组成和一次请求。"}
  - request: {en: "Show a technical executive the big picture", zh: "向技术负责人介绍全局"}
    first: C2
    next: [C1]
    note: {en: "Use C1 instead when the subject is a portfolio of applications, not one system.", zh: "如果主题是多个应用的全景而非单个系统，改用 C1。"}
  - request: {en: "Explain a solution to business readers", zh: "向业务读者说明方案"}
    first: A7
    next: [A1]
    note: {en: "Show the main solution blocks; use A1 when the question is business abilities or investment.", zh: "先展示方案的大块组成；讨论业务能力或投资时再用 A1。"}
  - request: {en: "Model order status", zh: "说明订单状态"}
    first: E3
    next: [E2]
    note: {en: "Show states and allowed changes; use E2 for the processing steps instead.", zh: "展示状态及允许的变化；如果要看处理步骤，改用 E2。"}
  - request: {en: "Explain who may access what", zh: "说明谁能访问什么"}
    first: F3
    next: [F1]
    note: {en: "Start with permissions and scope; add F1 to explain identity verification and enforcement.", zh: "先说明权限与范围；需要解释身份验证和执行位置时加 F1。"}
  - request: {en: "Plan a migration", zh: "规划迁移"}
    first: A8
    next: [G1, G2]
    note: {en: "Show coherent transition states; use paired current/target deployment or cloud views for detail.", zh: "展示可独立理解的过渡状态，再用现状与目标成对的部署或云架构图补充细节。"}
  - request: {en: "Draw a database or schema diagram", zh: "画数据库或数据模型图"}
    first: D1
    next: [D3]
    note: {en: "Show entities and relationships; add D3 when lineage and ownership matter.", zh: "展示实体与关系；关心血缘和归属时再加 D3。"}
  - request: {en: "Explain the release process", zh: "说明发布流程"}
    first: G4
    next: [G1]
    note: {en: "Show build, checks and promotion; add G1 for the resulting deployment.", zh: "展示构建、检查和晋级，再用 G1 说明最终部署。"}

matrix_overrides:
  - audience: leaders
    ask: runtime
    types: [G2, G1, A8]
    note: {en: "Start with a high-level service or deployment view; use A8 for migration decisions.", zh: "先看高层云服务或部署视图；迁移决策用 A8。"}
  - audience: business
    ask: security
    types: [F3]
    note: {en: "A plain-language permission matrix is useful to business owners.", zh: "业务负责人也需要易读的权限矩阵。"}
  - audience: developers
    ask: runtime
    types: [G1, G4, A8]
    note: {en: "Deployment, delivery and migration are common developer questions.", zh: "部署、交付和迁移都是开发者的常见问题。"}
  - audience: operations
    ask: runtime
    types: [G1, G2, G3, A8]
    note: {en: "Include migration alongside deployment and connectivity choices.", zh: "在部署与连通方案之外，也提供迁移视图。"}

phase_picks:
  initiate: [A1, C5, C1]
  requirements: [B2, C2, D1]
  design: [C3, D1, E1]
  build: [C4, E1, G4]
  operate: [G1, G4, H2]

reader_terms:
  - en: system architecture diagram
    zh: 系统架构图
    types: [C2, C3, A7, G1]
    note: {en: "Start with C2 for the system and its neighbours, then C3 for running parts. A7 is a conceptual solution overview; G1 shows deployment.", zh: "先用 C2 看系统与周边，再用 C3 看运行组成；A7 是概念方案概览，G1 展示部署。"}
  - en: application architecture diagram
    zh: 应用架构图
    types: [C1, C3]
    note: {en: "Portfolio of many applications (C1) or the running applications and data stores of one system (C3). Inside one running application is C4, not C3.", zh: "多应用全景用 C1，单个系统的可运行应用与数据存储用 C3。单个运行应用的内部组件是 C4，不是 C3。"}
  - en: big picture / architecture overview / system overview
    zh: 全局图 / 架构概览 / 系统概览
    types: [C2, C1, A7]
    note: {en: "Start with C2 for one system, C1 for many applications, or A7 for a business-level solution overview.", zh: "单个系统先用 C2，多应用用 C1，业务层方案概览用 A7。"}
  - en: database diagram / schema
    zh: 数据库图 / 数据模式
    types: [D1]
    note: {en: "Choose the conceptual, logical or physical level before adding fields and keys.", zh: "添加字段和键之前，先确定概念、逻辑还是物理层次。"}
  - en: AWS / Azure / GCP architecture diagram
    zh: AWS / Azure / GCP 架构图
    types: [G2]
    note: {en: "Cloud service composition; use G1 when software placement is the real question.", zh: "展示云服务组成；实际关心软件部署位置时用 G1。"}
  - en: Kubernetes diagram
    zh: Kubernetes 架构图
    types: [G1]
    note: {en: "Start with workload placement; add G3 only when routing and network isolation matter.", zh: "先看工作负载部署；只有关心路由与网络隔离时才加 G3。"}
  - en: microservices diagram
    zh: 微服务架构图
    types: [C3]
    note: {en: "Use C3 for running services and stores; E1 for one cross-service interaction.", zh: "运行服务与存储用 C3，单次跨服务交互用 E1。"}
  - en: workflow / user flow
    zh: 工作流 / 用户流程
    types: [E2, E4, A5, A6]
    note: {en: "Ask whether this means logic, hand-offs, a formal business process, or the user's experience.", zh: "先确认是逻辑步骤、角色交接、严格记法的业务流程，还是用户体验。"}
  - en: infrastructure diagram
    zh: 基础设施图
    types: [G1, G2, G3]
    note: {en: "Choose placement, cloud service composition or connectivity; they answer different questions.", zh: "部署位置、云服务组成和网络连通回答不同问题，先确定目的。"}
  - en: tech stack diagram
    zh: 技术栈图
    types: [C3, G2]
    note: {en: "Tie technologies to runnable responsibilities or cloud services, rather than drawing a logo list.", zh: "把技术对应到运行职责或云服务，而不是堆放标志。"}

# Asked before the tree (guided mode asks them one at a time; autonomous mode
# infers them and states the assumption).
first_questions:
  - en: "Who will read it, and what should they do afterwards (decide, approve, build, operate, review)?"
    zh: "谁来看？看完要做什么（决策、审批、开发、运维、评审）？"
  - en: "Which question must the figure answer? Pick one branch below."
    zh: "这张图要回答哪个问题？在下面选一个分支。"
  - en: "What is the scope: all applications in an organisation, one system, or one part inside it?"
    zh: "范围是什么：整个企业 / 应用组合、单个系统，还是系统内的一个部件？"
  - en: "Current state, target state, or both (as separate figures)?"
    zh: "画现状、目标，还是两者（分开成两张图）？"

root:
  value:
    - when: {en: "What the organisation can do, and where to invest", zh: "组织能做什么、投资往哪放"}
      types: [A1]
    - when: {en: "Which stages deliver value to a stakeholder", zh: "哪些阶段为干系人交付价值"}
      types: [A2, A9]
      hint: {en: "A2 has no timings and maps stages to capabilities; A9 measures process and waiting time.", zh: "A2 不含时间、把阶段映射到能力；A9 度量处理与等待时间。"}
    - when: {en: "What the solution is, in business terms", zh: "用业务语言说明方案是什么"}
      types: [A7]
    - when: {en: "How to get from today to the target, step by step", zh: "如何从现状分步走到目标"}
      types: [A8]
    - when: {en: "What a typical user experiences", zh: "某类用户（用户画像）的整体体验"}
      types: [A6]
    - when: {en: "Who has influence over the initiative and how to engage them", zh: "谁能影响项目、如何沟通"}
      types: [H3]
  scope:
    - when: {en: "What is in or out of scope, and who connects to us", zh: "范围内外是什么、谁与我们对接"}
      types: [B4, C2]
      hint: {en: "B4 when the point is the boundary of this phase; C2 when the subject is a software system and its neighbours.", zh: "强调本期边界用 B4；主题是软件系统及其外部时用 C2。"}
    - when: {en: "Which outside parties the business deals with, and what is exchanged", zh: "业务与哪些外部方往来、交换什么"}
      types: [A3]
    - when: {en: "Which roles do what, in which release", zh: "哪些角色做什么、在哪个版本"}
      types: [A4, B2]
      hint: {en: "A4 shows coverage across several roles; B2 tells one end-to-end story with release slices.", zh: "A4 展示多角色覆盖；B2 讲一个端到端故事并按版本切片。"}
    - when: {en: "Which user goals the system supports, and for whom", zh: "系统支持哪些用户目标、给谁"}
      types: [B1]
    - when: {en: "Which functions, how deep, with which priority", zh: "有哪些功能、拆多细、优先级如何"}
      types: [B3]
    - when: {en: "How a business case runs across participants", zh: "一件业务如何在参与方之间流转"}
      types: [A5]
    - when: {en: "What a typical user needs at each stage of one task", zh: "某类用户完成一项任务时在每个阶段需要什么"}
      types: [A6]
  structure:
    - when: {en: "Applications across the organisation, and who owns them", zh: "企业内的众多应用及其归属"}
      types: [C1]
    - when: {en: "Main blocks, for non-technical readers", zh: "给非技术读者看的主要组成"}
      types: [A7]
    - when: {en: "One system: users and neighbouring systems", zh: "单个系统：用户与外部系统"}
      types: [C2]
    - when: {en: "One system: its running applications and data stores", zh: "单个系统：可运行的应用与数据存储"}
      types: [C3]
    - when: {en: "Inside one application: its components", zh: "单个应用内部：组件"}
      types: [C4]
    - when: {en: "Responsibilities and interfaces, without technology", zh: "职责与接口，不含技术选型"}
      types: [C5]
    - when: {en: "Where different teams use different business models", zh: "领域中的模型边界"}
      types: [C7]
    - when: {en: "Code layers and allowed dependencies", zh: "代码分层与允许的依赖"}
      types: [C8]
    - when: {en: "How business, applications and technology support each other", zh: "业务、应用、技术如何互相支撑"}
      types: [I2]
  integration:
    - when: {en: "What interfaces exchange, how they authenticate, and what happens on failure", zh: "接口的集成方式、协议、认证与失败语义"}
      types: [C6]
    - when: {en: "Dependencies between applications across the organisation", zh: "企业范围内应用之间的依赖"}
      types: [C1]
    - when: {en: "How the running parts of one system talk", zh: "单个系统内各运行单元如何通信"}
      types: [C3]
    - when: {en: "Message order in one scenario", zh: "一个场景中的消息顺序"}
      types: [E1]
    - when: {en: "Relationships between domain models and teams", zh: "领域模型与团队之间的关系"}
      types: [C7]
  data:
    - when: {en: "Which business objects exist and how they relate", zh: "有哪些业务对象、如何关联"}
      types: [D1]
    - when: {en: "How data moves between processes and stores", zh: "数据如何在加工与存储之间流动"}
      types: [D2]
    - when: {en: "Where a dataset came from, and who owns it", zh: "数据从哪里来、归谁负责"}
      types: [D3]
    - when: {en: "Which data crosses a change in control or access rights", zh: "哪些数据跨越信任边界"}
      types: [F2]
  behaviour:
    - when: {en: "Messages between participants, in order", zh: "参与者之间按顺序的消息"}
      types: [E1]
    - when: {en: "Steps, decisions and parallel branches of one piece of logic", zh: "一段逻辑的步骤、判断与并行分支"}
      types: [E2]
    - when: {en: "The lifecycle of one object", zh: "一个对象的生命周期"}
      types: [E3]
    - when: {en: "Hand-offs between roles or systems", zh: "角色或系统之间的交接"}
      types: [E4, A5]
      hint: {en: "E4 for simple hand-offs; A5 when the diagram needs strict rules for process events and messages (BPMN).", zh: "轻量交接（常以系统为泳道）用 E4；需要 BPMN 语义（池、消息流、事件）时用 A5。"}
    - when: {en: "How sign-in and access decisions happen", zh: "登录与访问判定如何发生"}
      types: [F1]
    - when: {en: "Where a delivery process waits", zh: "交付过程在哪里等待"}
      types: [A9]
  security:
    - when: {en: "Sign-in, tokens, and where access is decided", zh: "登录、令牌，以及访问在哪里判定"}
      types: [F1]
    - when: {en: "What could go wrong when data crosses a change in control", zh: "威胁与信任边界"}
      types: [F2]
    - when: {en: "Who may do what, in which scope", zh: "谁在什么范围内能做什么"}
      types: [F3]
    - when: {en: "Network exposure and paths", zh: "网络暴露面与路径"}
      types: [G3]
  runtime:
    - when: {en: "How to migrate from today's system to the target", zh: "如何从现有系统迁移到目标"}
      types: [A8]
      cross_facet_reason: {en: "Migration spans architecture decisions and deployment, beyond A8's primary value/structure facets.", zh: "迁移横跨架构决策与部署，不局限于 A8 的主要价值和结构维度。"}
    - when: {en: "Where the software runs", zh: "软件运行在哪里"}
      types: [G1]
    - when: {en: "Which cloud services, and their failure boundaries", zh: "使用哪些云服务及其故障边界"}
      types: [G2]
    - when: {en: "Network segments and paths", zh: "网络分区与路径"}
      types: [G3]
    - when: {en: "How a change ships to production", zh: "变更如何发布到生产"}
      types: [G4]
    - when: {en: "How the running system is observed", zh: "如何观测运行中的系统"}
      types: [H2]
  operations:
    - when: {en: "Who is responsible for each activity", zh: "每项活动由谁负责"}
      types: [H1]
    - when: {en: "Who must be engaged, and how", zh: "需要与谁沟通、如何沟通"}
      types: [H3]
    - when: {en: "How problems are detected and answered", zh: "问题如何被发现与响应"}
      types: [H2]
    - when: {en: "Who owns which data", zh: "哪些数据归谁"}
      types: [D3]
    - when: {en: "Hand-offs in an operating procedure", zh: "运维流程中的交接"}
      types: [E4]
    - when: {en: "Owners and lifecycle state of applications", zh: "应用的归属与生命周期状态"}
      types: [C1]
    - when: {en: "Checks and approvals before releasing a change", zh: "发布控制与晋级关卡"}
      types: [G4]
  views:
    - when: {en: "Several views for different readers, kept consistent", zh: "面向不同读者的多张视图并保持一致"}
      types: [I1]
    - when: {en: "One enterprise view across business, application and technology", zh: "跨业务、应用、技术的企业视图"}
      types: [I2]
