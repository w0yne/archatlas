# Bilingual glossary: the fixed Chinese rendering of each English term used on the site and in diagram labels.
# Translators use `zh` exactly; `avoid` lists renderings that must not be used (wrong sense or inconsistent);
# `note` explains the sense when a term is overloaded. Terms listed under `keep` are written as-is in Chinese text.
version: 1

keep:
  - C4 model
  - UML
  - BPMN
  - ArchiMate
  - TOGAF
  - arc42
  - ISO/IEC/IEEE 42010
  - DDD
  - RACI
  - RBAC
  - ABAC
  - ReBAC
  - OAuth 2.0
  - OpenID Connect
  - SSO
  - JWT
  - SAML
  - STRIDE
  - API
  - OpenAPI
  - AsyncAPI
  - ERD
