# Bilingual glossary: the fixed Chinese rendering of each English term used on the site and in diagram labels.
# Translators use `zh` exactly; `avoid` lists renderings that must not be used (wrong sense or inconsistent);
# `note` explains the sense when a term is overloaded; `note_zh` is its Chinese counterpart.
# Context-qualified entries apply only in that context. Terms under `keep` stay as-is in Chinese text.
