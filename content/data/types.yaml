# Catalogue of architecture diagram types: the single source for indexes, the
# selection guide (tools/build_selection.py) and type-page front matter.
#
# Field reference (one entry per type under `types:`):
#   code        catalogue code (A1 ... I2); new codes are only added, never reused
#   slug        stable URL id; page path is types/<code lower>-<slug>
#   family      A-I, see `families`
#   names       canonical name {en, zh}
#   aliases     other names that mean the same type {en: [], zh: []}; an alias
#               belongs to exactly one type. A colloquial name that can mean
#               several types goes into `terms` instead.
#   question    the question the diagram answers {en, zh}
#   asks        question facets (keys of `facets.asks`); used by the decision
#               tree and the audience x question matrix
#   audiences   keys of `facets.audiences`
#   levels      keys of `facets.levels` (abstraction)
#   phases      keys of `facets.phases` (lifecycle)
#   scope       key of `facets.scope`
#   formal      kind: standard (formal specification) | method (published
#               method or approach) | convention (no standard; practice only)
#               basis: one line naming what the drawing follows
#   standards   [{name, url}] primary references (accessed 2026-10-14 unless
#               a per-type research file says otherwise)
#   variants    optional sub-kinds kept under the same code
#   neighbours  codes of types readers confuse with this one or move to next
#   research    done | pending (phase-2 per-type research present or not)
#   status      draft | reviewed
#   split_from  only on types created by splitting an older entry
#   changes     notes on what changed against the internal v4 guide
#               [{kind: split|rename|scope|fact, note}]

version: 1

families:
  A: {en: Business and strategy, zh: 战略与业务}
  B: {en: Requirements, zh: 需求}
  C: {en: Application and system architecture, zh: 应用与系统架构}
  D: {en: Data, zh: 数据}
  E: {en: Behaviour, zh: 行为}
  F: {en: Security and identity, zh: 安全与身份}
  G: {en: Technology and infrastructure, zh: 技术与基础设施}
  H: {en: Operations and governance, zh: 运营与治理}
  I: {en: View frameworks, zh: 视图框架}

facets:
  asks:
    value:       {en: "Why invest, and where is the value?", zh: "为什么做、价值在哪、投资往哪放？"}
    scope:       {en: "What must it do, for whom, and what is in or out?", zh: "要做什么、给谁用、范围内外是什么？"}
    structure:   {en: "What are the parts and how are they organised?", zh: "由哪些部分组成、如何组织？"}
    integration: {en: "How do the parts and systems connect?", zh: "各部分 / 各系统之间怎么连接？"}
    data:        {en: "What data is there, where does it flow, who owns it?", zh: "有哪些数据、怎么流动、归谁负责？"}
    behaviour:   {en: "What happens, in which order, with which states?", zh: "事情按什么顺序发生、有哪些状态？"}
    security:    {en: "Who may do what, and what could go wrong?", zh: "谁能做什么、哪里可能出安全问题？"}
    runtime:     {en: "Where does it run and how does it ship?", zh: "跑在哪里、怎么发布？"}
    operations:  {en: "Who is responsible, and how is it run and watched?", zh: "谁负责、怎么运行和监控？"}
    views:       {en: "How do I organise several diagrams into one description?", zh: "怎样把多张图组织成一套架构描述？"}
  audiences:
    leaders:    {en: Leaders and sponsors, zh: 领导与发起人}
    business:   {en: Business owners and analysts, zh: 业务负责人与业务分析}
    product:    {en: Product and design, zh: 产品与设计}
    architects: {en: Architects, zh: 架构师}
    developers: {en: Developers and testers, zh: 开发与测试}
    operations: {en: Operations and SRE, zh: 运维与 SRE}
    security:   {en: Security and compliance, zh: 安全与合规}
  levels:
    strategy: {en: Strategy / business, zh: 战略 / 业务}
    concept:  {en: Requirements / concept, zh: 需求 / 概念}
    logical:  {en: Logical / design, zh: 逻辑 / 设计}
    physical: {en: Physical / implementation, zh: 物理 / 实现}
  phases:
    initiate:     {en: Initiate, zh: 立项}
    requirements: {en: Requirements, zh: 需求}
    design:       {en: Design, zh: 设计}
    build:        {en: Build, zh: 构建}
    operate:      {en: Release and operate, zh: 发布与运营}
  scope:
    enterprise: {en: Enterprise or portfolio, zh: 企业 / 应用组合}
    system:     {en: One system or initiative, zh: 单个系统 / 项目}
    component:  {en: Inside one system part, zh: 单个部件内部}

# Colloquial names that do not identify one type. The selection guide shows
# them with a note so that an agent asks or picks deliberately.
terms:
  - en: system architecture diagram
    zh: 系统架构图
    types: [C3, A7, G1]
    note: {en: "Usually the container view (C3); for leaders the conceptual overview (A7); sometimes the deployment view (G1). Ask which.", zh: "多数指容器图（C3）；给领导时指概念架构（A7）；有时指部署图（G1）。先问清楚。"}
  - en: technical architecture diagram
    zh: 技术架构图
    types: [C3, G1, G2]
    note: {en: "Containers with technology labels (C3), or the infrastructure views (G1, G2).", zh: "带技术选型的容器图（C3），或基础设施视图（G1、G2）。"}
  - en: application architecture diagram
    zh: 应用架构图
    types: [C1, C3]
    note: {en: "Portfolio of many applications (C1) or the inside of one application (C3).", zh: "企业级指多应用全景（C1）；单系统级指容器图（C3）。"}
  - en: business architecture diagram
    zh: 业务架构图
    types: [A1, A2, A5]
    note: {en: "A family, not one diagram: capabilities (A1), value streams (A2), processes (A5).", zh: "是一类图而不是一张图：能力（A1）、价值流（A2）、流程（A5）。"}
  - en: context diagram
    zh: 上下文图
    types: [C2, A3, B4]
    note: {en: "Software system and its neighbours (C2); business exchanges (A3); in/out of scope (B4).", zh: "软件系统与外部（C2）；业务往来（A3）；范围内外（B4）。"}
  - en: flowchart
    zh: 流程图
    types: [E2, A5, E4]
    note: {en: "Logic of one procedure (E2); business process with BPMN semantics (A5); hand-offs between roles or systems (E4).", zh: "一段处理逻辑（E2）；有 BPMN 语义的业务流程（A5）；角色 / 系统间交接（E4）。"}
  - en: swimlane diagram
    zh: 泳道图
    types: [E4, A5]
    note: {en: "Lightweight hand-offs (E4) or BPMN pools and lanes with message flows (A5).", zh: "轻量交接（E4），或 BPMN 的池 / 道与消息流（A5）。"}
  - en: physical architecture diagram
    zh: 物理架构图
    types: [G1, G3]
    note: {en: "Software placed on infrastructure (G1) or the network (G3). State which.", zh: "软件部署到基础设施（G1）或网络（G3），需说明是哪种。"}
  - en: module diagram
    zh: 模块图
    types: [C4, C5, C8]
    note: {en: "Components inside one container (C4), technology-neutral responsibilities (C5) or code layers (C8).", zh: "单个容器内部组件（C4）、与技术无关的职责模块（C5）或代码分层（C8）。"}
  - en: functional architecture diagram
    zh: 功能架构图
    types: [C5, B3]
    note: {en: "Logical responsibilities (C5); a function tree in the systems-engineering sense (B3).", zh: "逻辑职责划分（C5）；系统工程意义上的功能分解（B3）。"}
  - en: value stream map
    zh: 价值流图
    types: [A2, A9]
    note: {en: "Business-architecture value stream without times (A2) or Lean value-stream map with process and lead times (A9).", zh: "业务架构价值流，不含时间（A2）；或含处理 / 提前期的精益价值流图（A9）。"}
  - en: reference architecture
    zh: 参考架构
    types: [G2, A7, C3]
    note: {en: "A reuse status (reference, proposed, implemented, observed), not a diagram type. Pick the view, then state the status.", zh: "是一种状态（参考 / 方案 / 已实现 / 实测），不是图的类型。先选视图，再标明状态。"}
  - en: interaction diagram
    zh: 交互图
    types: [E1]
    note: {en: "In UML the family name for sequence, communication, timing and interaction-overview diagrams; the sequence diagram is the usual pick.", zh: "UML 中是时序图、通信图、时间图、交互概览图的统称；通常选时序图。"}
  - en: layered diagram
    zh: 分层图
    types: [C8, A7, I2]
    note: {en: "Code layers with a dependency rule (C8), conceptual bands (A7) or ArchiMate business/application/technology layers (I2).", zh: "带依赖规则的代码分层（C8）、概念分层（A7）或 ArchiMate 业务 / 应用 / 技术分层（I2）。"}
  - en: data map
    zh: 数据地图
    types: [D3, D2]
    note: {en: "Where data comes from and who owns it (D3), or how it moves between processes (D2).", zh: "数据来源与归属（D3），或数据在加工之间如何流动（D2）。"}

types:

# ---------------------------------------------------------------- A business
- code: A1
  slug: capability-map
  family: A
  names: {en: Business capability map, zh: 业务能力图}
  aliases:
    en: [capability map, capability heat map, capability landscape, business capability model]
    zh: [能力地图, 能力热力图, 业务能力模型]
  question:
    en: What can the organisation do, independent of who or what does it, and where should it invest?
    zh: 组织“能做什么”（与由谁、用什么系统做无关）？哪些能力要加强，投资该往哪放？
  asks: [value, structure]
  audiences: [leaders, business, architects]
  levels: [strategy]
  phases: [initiate]
  scope: enterprise
  formal: {kind: standard, basis: "ArchiMate 3.2 Capability element and Capability Map viewpoint; TOGAF/BIZBOK content rules"}
  standards:
    - {name: "ArchiMate 3.2 Specification, Example Viewpoints (Capability Map)", url: "https://pubs.opengroup.org/architecture/archimate3-doc/ch-Example-Viewpoints.html"}
    - {name: "TOGAF Series Guide: Business Capabilities, Version 2 (G211)", url: "https://publications.opengroup.org/g211"}
  variants: [capability map, capability heat map (one assessment lens per map)]
  neighbours: [A2, C1, A7, A8]
  research: done
  status: draft
  changes:
    - {kind: fact, note: "Notation is not 'no standard': ArchiMate defines the Capability element and a Capability Map viewpoint."}
    - {kind: fact, note: "2-3 levels applies to the one-page map; the model often has 3-6 levels. Added BIZBOK rules (definition per capability, non-redundant, object-based names)."}

- code: A2
  slug: value-stream
  family: A
  names: {en: Value stream (business architecture), zh: 价值流（业务架构）}
  aliases:
    en: [value stream diagram, value stream stages, value stream capability cross-map]
    zh: [价值流阶段图, 价值流能力映射]
  question:
    en: Which stages does a stakeholder pass through, from trigger to delivered value, and which capabilities enable each stage?
    zh: 从触发到交付价值，干系人经过哪些价值阶段？每个阶段由哪些能力支撑？
  asks: [value]
  audiences: [leaders, business, architects]
  levels: [strategy]
  phases: [initiate]
  scope: enterprise
  formal: {kind: standard, basis: "TOGAF Series Guide: Value Streams (G178); ArchiMate Value Stream element (since 3.1)"}
  standards:
    - {name: "TOGAF Series Guide: Value Streams (G178)", url: "https://publications.opengroup.org/g178"}
    - {name: "ArchiMate 3.2 Specification", url: "https://pubs.opengroup.org/architecture/archimate3-doc/"}
  neighbours: [A9, A1, A5, A6]
  research: done
  status: draft
  changes:
    - {kind: split, note: "The v4 'Value Stream Map' mixed two types. A2 keeps the business-architecture value stream (no times); the Lean value-stream map moves to the new A9."}
    - {kind: rename, note: "Renamed from 'Value Stream Map' to 'Value stream (business architecture)'."}

- code: A3
  slug: business-context
  family: A
  names: {en: Business context diagram, zh: 业务上下文图}
  aliases:
    en: [business context, business environment diagram]
    zh: [业务背景图, 业务环境图]
  question:
    en: Which outside parties does the business or initiative deal with, and what do they exchange (goods, money, information, obligations)?
    zh: 业务或项目与哪些外部方打交道？彼此交换什么（货物、资金、信息、义务）？
  asks: [scope]
  audiences: [leaders, business, architects]
  levels: [strategy, concept]
  phases: [initiate, requirements]
  scope: system
  formal: {kind: method, basis: "Structured-analysis context diagram; arc42 section 3.1 business context"}
  standards:
    - {name: "arc42, section 3: Context and Scope", url: "https://docs.arc42.org/section-3/"}
    - {name: "C4 model: System Context diagram (software counterpart)", url: "https://c4model.com/diagrams/system-context"}
  neighbours: [C2, B4, H3]
  research: done
  status: draft
  changes:
    - {kind: split, note: "The v4 'Business Context & Stakeholder Map' was split: A3 keeps the business context diagram; the stakeholder power/interest map moves to the new H3."}
    - {kind: fact, note: "Choose C2 once the subject is a software system, B4 for in/out of scope, A3 for business exchanges."}

- code: A4
  slug: scenario-matrix
  family: A
  names: {en: "Business scenario matrix (role × activity)", zh: 业务场景矩阵（角色 × 活动）}
  aliases:
    en: [scenario coverage matrix, role-activity matrix, business scenario map]
    zh: [业务场景地图, 场景覆盖矩阵]
  question:
    en: Which roles take part in which business activities, and in which release is each scenario supported?
    zh: 哪些角色参与哪些业务活动？每个场景在哪个版本支持？
  asks: [scope]
  audiences: [business, product]
  levels: [concept]
  phases: [requirements]
  scope: system
  formal: {kind: convention, basis: "No standard; cells follow Cockburn's user-goal level, columns follow a narrative backbone"}
  standards:
    - {name: "TOGAF Business Scenarios (a different technique; named to avoid confusion)", url: "https://pubs.opengroup.org/togaf-standard/business-architecture/business-scenarios.html"}
    - {name: "Agile Alliance glossary: story mapping (column backbone)", url: "https://agilealliance.org/glossary/story-mapping/"}
  neighbours: [B1, B2, A6, H1]
  research: done
  status: draft
  changes:
    - {kind: rename, note: "Renamed from 'Business Scenario Map': not an established term and it collides with TOGAF Business Scenarios and IBM scenario maps."}
    - {kind: fact, note: "Overlap with B1 was overstated; A4 adds phasing and deliberate gaps across roles."}

- code: A5
  slug: bpmn-process
  family: A
  names: {en: Business process diagram (BPMN), zh: 业务流程图（BPMN）}
  aliases:
    en: [BPMN diagram, BPMN collaboration diagram, BPMN process diagram, process map]
    zh: [BPMN 流程图, 业务流程建模图, BPMN 协作图]
  question:
    en: How does a business case run from start to end, who does each step, where does it branch, and what passes between participants?
    zh: 一件业务如何从开始走到结束？每一步谁做、在哪分支、参与方之间传递什么？
  asks: [scope, behaviour]
  audiences: [business, product, developers]
  levels: [concept]
  phases: [requirements, design]
  scope: system
  formal: {kind: standard, basis: "OMG BPMN 2.0.2 (2014); ISO/IEC 19510:2013 equals BPMN 2.0.1 with the same notation"}
  standards:
    - {name: "OMG BPMN 2.0.2", url: "https://www.omg.org/spec/BPMN/2.0.2/"}
    - {name: "ISO/IEC 19510:2013", url: "https://www.iso.org/standard/62652.html"}
  variants: [process diagram, collaboration diagram (pools + message flows)]
  neighbours: [E4, E2, A2, E1]
  research: done
  status: draft
  changes:
    - {kind: fact, note: "Pool = participant, lane = partition inside a pool; sequence flow never crosses pools, message flow only connects pools."}
    - {kind: fact, note: "Not 'the same drawing' as E4: A5 for BPMN semantics, E4 for lightweight hand-offs."}

- code: A6
  slug: journey-map
  family: A
  names: {en: Customer or user journey map, zh: 用户旅程图}
  aliases:
    en: [customer journey map, user journey map, UX journey map]
    zh: [客户旅程图, 顾客旅程地图, 体验旅程图]
  question:
    en: For one persona in one scenario, which stages do they go through, what do they do, think and feel, and where are the opportunities?
    zh: 某个角色在某个场景中经历哪些阶段？做什么、想什么、感受如何，机会点在哪？
  asks: [value, scope]
  audiences: [product, business, leaders]
  levels: [strategy, concept]
  phases: [initiate, requirements]
  scope: system
  formal: {kind: convention, basis: "No formal standard; Nielsen Norman Group structure (lens, experience, outputs)"}
  standards:
    - {name: "NN/g: Journey Mapping 101", url: "https://www.nngroup.com/articles/journey-mapping-101/"}
    - {name: "Shostack, Designing Services That Deliver (service blueprint, neighbour)", url: "https://hbr.org/1984/01/designing-services-that-deliver"}
  neighbours: [B2, A4, A2]
  research: done
  status: draft
  changes:
    - {kind: fact, note: "Experience map and service blueprint are neighbours, not synonyms. Decide current vs future state and research-based vs hypothesis first."}

- code: A7
  slug: conceptual-architecture
  family: A
  names: {en: Conceptual architecture (solution overview), zh: 概念架构图（方案概览）}
  aliases:
    en: [solution overview, solution concept diagram, high-level architecture, architecture on a page, block diagram]
    zh: [方案概览图, 方案总览, 高层架构图, 一页纸架构, 方案构想图]
  question:
    en: Which major blocks make up the solution and what is each one for, in terms the business understands?
    zh: 方案由哪些大块组成？每一块在业务上起什么作用？
  asks: [structure, value]
  audiences: [leaders, business, architects]
  levels: [concept]
  phases: [initiate, design]
  scope: system
  formal: {kind: method, basis: "TOGAF Solution Concept diagram (Phase A); informal notation that needs a title and a legend"}
  standards:
    - {name: "TOGAF Standard, Architecture Content (solution concept diagram)", url: "https://pubs.opengroup.org/togaf-standard/architecture-content/chap03.html"}
    - {name: "C4 model: notation (title, legend, consistent shapes)", url: "https://c4model.com/diagrams/notation"}
  neighbours: [C2, C3, C1, A8]
  research: done
  status: draft
  changes:
    - {kind: fact, note: "Not 'no standard': TOGAF defines the Solution Concept artifact. 5-9 blocks is a heuristic. C4 has no conceptual level; A7 sits between C2 and C3."}

- code: A8
  slug: target-roadmap
  family: A
  names: {en: Target architecture and transition roadmap, zh: 目标架构与演进路线图}
  aliases:
    en: [architecture roadmap, transition architecture, migration roadmap, as-is to-be roadmap, plateau diagram]
    zh: [演进路线图, 架构路线图, 迁移路线图, 过渡架构]
  question:
    en: What does it look like today, where is it going, which coherent transition states lead there, and what value does each state deliver?
    zh: 现状是什么、目标是什么、经过哪些可独立交付价值的过渡态、每一步交付什么？
  asks: [value]
  audiences: [leaders, architects]
  levels: [strategy]
  phases: [initiate, design]
  scope: enterprise
  formal: {kind: standard, basis: "TOGAF ADM baseline/target/transition (phases B-F); ArchiMate implementation and migration elements"}
  standards:
    - {name: "TOGAF Standard, ADM techniques", url: "https://pubs.opengroup.org/togaf-standard/adm-techniques/chap03.html"}
    - {name: "ArchiMate 3.2 Specification", url: "https://pubs.opengroup.org/architecture/archimate3-doc/"}
  neighbours: [A7, A1, C1]
  research: done
  status: draft
  changes:
    - {kind: fact, note: "The roadmap (work packages, transition states, value) is separate from the implementation and migration plan (schedule). TOGAF says 'one or more' transition states, not 2-3."}

- code: A9
  slug: lean-value-stream-map
  family: A
  names: {en: Lean value-stream map (VSM), zh: 精益价值流图（VSM）}
  aliases:
    en: [VSM, material and information flow diagram, lean value stream mapping]
    zh: [精益价值流映射, 物料与信息流图]
  question:
    en: How do material and information flow through a delivery process, and where is time spent waiting rather than working?
    zh: 物料与信息如何在交付过程中流动？时间花在处理上还是等待上？
  asks: [value, behaviour]
  audiences: [business, leaders, operations]
  levels: [strategy, concept]
  phases: [initiate, operate]
  scope: system
  formal: {kind: method, basis: "Lean value-stream mapping (Rother and Shook, Learning to See; Lean Enterprise Institute)"}
  standards:
    - {name: "Lean Enterprise Institute: value-stream mapping", url: "https://www.lean.org/lexicon-terms/value-stream-mapping/"}
  neighbours: [A2, A5, G4]
  research: done
  status: draft
  split_from: A2
  changes:
    - {kind: split, note: "New code. Split from the v4 A2 entry, whose process/wait times and timeline belonged to Lean VSM."}

# ---------------------------------------------------------------- B requirements
- code: B1
  slug: use-case-diagram
  family: B
  names: {en: Use case diagram, zh: 用例图}
  aliases:
    en: [UML use case diagram]
    zh: [UML 用例图]
  question:
    en: Which user goals does the system support, and for which actors?
    zh: 系统支持哪些用户目标（用例）？分别给哪些参与者？
  asks: [scope]
  audiences: [product, business, developers]
  levels: [concept]
  phases: [requirements]
  scope: system
  formal: {kind: standard, basis: "OMG UML 2.5.1 use case diagram"}
  standards:
    - {name: "OMG UML 2.5.1", url: "https://www.omg.org/spec/UML/2.5.1/"}
  neighbours: [A4, B2, B4]
  research: pending
  status: draft
  changes:
    - {kind: fact, note: "The v4 synonym line 'same question as A4' is reworded: A4 adds phasing and gaps across roles (batch A finding)."}

- code: B2
  slug: user-story-map
  family: B
  names: {en: User story map, zh: 用户故事地图}
  aliases:
    en: [story map, story mapping]
