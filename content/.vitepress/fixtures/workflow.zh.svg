<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150"><title>从问题到有用的架构图</title><desc>先明确读者与问题，再选择能够回答它的视图。以证据绘图，检查输出，并复核实际图片。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker></defs><rect width="760" height="150" fill="#ffffff"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" text-anchor="middle" fill="#173e3b"><rect x="12" y="36" width="206" height="70" rx="10" fill="#ecfdf5" stroke="#0f766e"/><text x="115" y="78">明确读者与问题</text><rect x="276" y="36" width="206" height="70" rx="10" fill="#ecfdf5" stroke="#0f766e"/><text x="379" y="78">选择合适的视图</text><rect x="540" y="36" width="206" height="70" rx="10" fill="#ecfdf5" stroke="#0f766e"/><text x="643" y="78">绘图、检查与复核</text></g><g stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"><line x1="220" y1="71" x2="272" y2="71"/><line x1="484" y1="71" x2="536" y2="71"/></g></svg>
