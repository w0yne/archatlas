<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" lang="zh" data-archatlas="0.1">
  <title>A5 · 申请服务工单 — 先审批后执行（目标流程）</title>
  <desc>虚构教学设计，场景版本2；补充参数为示意假设。虚构目标设计 · BPMN 2.0 协作图，描述级图形 · 一个实例：一次工单申请</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4B5563" />
    </marker>
    <marker id="msg-start" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="4" fill="#ffffff" stroke="#4B5563" stroke-width="1.4" />
    </marker>
    <marker id="msg-end" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ffffff" stroke="#4B5563" stroke-width="1.4" />
    </marker>
  </defs>
  <rect data-role="canvas" width="1400" height="900" fill="#ffffff" />
  <text x="28" y="40" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#1F2937">A5 · 申请服务工单 — 先审批后执行（目标流程）</text>
  <text x="28" y="72" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937">虚构目标设计 · BPMN 2.0 协作图，描述级图形 · 一个实例：一次工单申请</text>
  <rect x="25" y="100" width="1350" height="220" data-role="group" data-id="POOL-employee" data-kind="pool" data-band-axis="x" fill="#FFFBEB" stroke="#936A16" stroke-width="1.6" rx="10" />
  <rect x="26" y="101" width="170" height="218" data-role="header-band" data-parent="POOL-employee" fill="#FFF1C9" stroke="none" />
  <text x="39" y="134" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#1F2937" data-owner="POOL-employee" data-role="group-title">员工 / 审批人</text>
  <rect x="25" y="350" width="1350" height="220" data-role="group" data-id="POOL-assistant" data-kind="pool" data-band-axis="x" fill="#FFFBEB" stroke="#936A16" stroke-width="1.6" rx="10" />
  <rect x="26" y="351" width="170" height="218" data-role="header-band" data-parent="POOL-assistant" fill="#FFF1C9" stroke="none" />
  <text x="39" y="384" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#1F2937" data-owner="POOL-assistant" data-role="group-title">企业服务助手</text>
  <rect x="25" y="600" width="1350" height="80" data-role="group" data-id="POOL-desk" data-kind="pool" data-band-axis="x" fill="#F7F7F7" stroke="#666A73" stroke-width="1.6" rx="10" />
  <rect x="26" y="601" width="170" height="78" data-role="header-band" data-parent="POOL-desk" fill="#EDEDED" stroke="none" />
  <text x="39" y="634" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#1F2937" data-owner="POOL-desk" data-role="group-title">服务工单系统</text>
  <circle cx="230" cy="230" r="20" data-role="node" data-id="EV-need" data-kind="event" data-parent="POOL-employee" data-style="peer" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" />
  <text x="230" y="270" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle">需要工单</text>
  <rect x="275" y="195" width="150" height="70" data-role="node" data-id="P-ask" data-kind="task" data-parent="POOL-employee" data-style="peer" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="14" />
  <text x="350" y="235" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle" data-owner="P-ask" data-role="name">请求工单</text>
  <rect x="505" y="195" width="150" height="70" data-role="node" data-id="P-review" data-kind="task" data-parent="POOL-employee" data-style="peer" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="14" />
  <text x="580" y="235" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle" data-owner="P-review" data-role="name">查看草稿</text>
  <polygon points="720.0,195 755,230.0 720.0,265 685,230.0" data-role="node" data-id="G-approve" data-kind="gateway" data-parent="POOL-employee" data-style="peer" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" />
  <text x="720" y="287" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle">批准草稿？</text>
  <rect x="785" y="195" width="150" height="70" data-role="node" data-id="P-confirm" data-kind="task" data-parent="POOL-employee" data-style="peer" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="14" />
  <text x="860" y="235" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle" data-owner="P-confirm" data-role="name">批准草稿</text>
  <circle cx="1000" cy="230" r="20" data-role="node" data-id="EV-approved" data-kind="event" data-parent="POOL-employee" data-style="peer" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="4" />
  <text x="1000" y="270" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle">草稿已批准</text>
  <circle cx="860" cy="140" r="20" data-role="node" data-id="EV-declined" data-kind="event" data-parent="POOL-employee" data-style="peer" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="4" />
  <text x="890" y="145" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937">请求被拒绝</text>
  <circle cx="350" cy="460" r="20" data-role="node" data-id="EV-received" data-kind="event" data-parent="POOL-assistant" data-style="peer" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" />
  <text x="350" y="500" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle">收到请求</text>
  <rect x="505" y="425" width="150" height="70" data-role="node" data-id="P-plan" data-kind="task" data-parent="POOL-assistant" data-style="peer" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="14" />
  <text x="580" y="465" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle" data-owner="P-plan" data-role="name">1. 起草请求</text>
  <rect x="785" y="425" width="150" height="70" data-role="node" data-id="P-approve" data-kind="task" data-parent="POOL-assistant" data-style="peer" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="14" />
  <text x="860" y="465" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle" data-owner="P-approve" data-role="name">2. 绑定审批</text>
  <rect x="985" y="425" width="150" height="70" data-role="node" data-id="P-execute" data-kind="task" data-parent="POOL-assistant" data-style="peer" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="14" />
  <text x="1060" y="465" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle" data-owner="P-execute" data-role="name">3. 工具再授权</text>
  <circle cx="1210" cy="460" r="20" data-role="node" data-id="EV-created" data-kind="event" data-parent="POOL-assistant" data-style="peer" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="4" />
  <text x="1210" y="500" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle">工单已创建</text>
  <polyline points="250,230 275,230" data-role="edge" data-id="SF-1" data-from="EV-need" data-to="P-ask" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <polyline points="425,230 505,230" data-role="edge" data-id="SF-2" data-from="P-ask" data-to="P-review" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <polyline points="655,230 685,230" data-role="edge" data-id="SF-3" data-from="P-review" data-to="G-approve" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <polyline points="755,230 785,230" data-role="edge" data-id="SF-4" data-from="G-approve" data-to="P-confirm" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <polyline points="935,230 980,230" data-role="edge" data-id="SF-5" data-from="P-confirm" data-to="EV-approved" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <polyline points="720,195 720,140 840,140" data-role="edge" data-id="SF-6" data-from="G-approve" data-to="EV-declined" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="725.0" y="158.0" width="24.0" height="27.599999999999998" fill="#ffffff" data-role="label-bg" data-id="label-SF-6" data-parent="SF-6" />
  <text x="730" y="176" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-owner="SF-6" data-role="edge-label">否</text>
  <polyline points="370,460 505,460" data-role="edge" data-id="SF-7" data-from="EV-received" data-to="P-plan" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <polyline points="655,460 785,460" data-role="edge" data-id="SF-8" data-from="P-plan" data-to="P-approve" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <polyline points="935,460 985,460" data-role="edge" data-id="SF-9" data-from="P-approve" data-to="P-execute" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <polyline points="1135,460 1190,460" data-role="edge" data-id="SF-10" data-from="P-execute" data-to="EV-created" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="759" y="222" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#1F2937">是</text>
  <polyline points="350,265 350,440" data-role="edge" data-id="MF-1" data-from="P-ask" data-to="EV-received" data-kind="message" fill="none" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#msg-start)" marker-end="url(#msg-end)" />
  <rect x="355.0" y="322.0" width="38.0" height="27.599999999999998" fill="#ffffff" data-role="label-bg" data-id="label-MF-1" data-parent="MF-1" />
  <text x="360" y="340" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-owner="MF-1" data-role="edge-label">请求</text>
  <polyline points="580,425 580,265" data-role="edge" data-id="MF-2" data-from="P-plan" data-to="P-review" data-kind="message" fill="none" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#msg-start)" marker-end="url(#msg-end)" />
  <rect x="585.0" y="322.0" width="95.296875" height="27.599999999999998" fill="#ffffff" data-role="label-bg" data-id="label-MF-2" data-parent="MF-2" />
  <text x="590" y="340" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-owner="MF-2" data-role="edge-label">草稿 + 有效期</text>
  <polyline points="860,265 860,425" data-role="edge" data-id="MF-3" data-from="P-confirm" data-to="P-approve" data-kind="message" fill="none" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#msg-start)" marker-end="url(#msg-end)" />
  <rect x="865.0" y="322.0" width="108.0" height="27.599999999999998" fill="#ffffff" data-role="label-bg" data-id="label-MF-3" data-parent="MF-3" />
  <text x="870" y="340" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-owner="MF-3" data-role="edge-label">对此草稿的审批</text>
  <polyline points="1060,495 1060,600" data-role="edge" data-id="MF-4" data-from="P-execute" data-to="POOL-desk" data-kind="message" fill="none" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#msg-start)" marker-end="url(#msg-end)" />
  <rect x="1065.0" y="538.0" width="123.296875" height="27.599999999999998" fill="#ffffff" data-role="label-bg" data-id="label-MF-4" data-parent="MF-4" />
  <text x="1070" y="556" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-owner="MF-4" data-role="edge-label">创建工单 + 幂等键</text>
  <text x="25" y="720" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937">被拒绝或过期的草稿永不执行；创建工单复用同一幂等键，见 E1 与 E4。</text>
  <rect x="28" y="750" width="42" height="24" data-role="legend-zone" data-id="__legend-swatch-1" data-band-axis="x" fill="#FFFBEB" stroke="#936A16" stroke-width="1.6" rx="10" />
  <rect x="29" y="751" width="10" height="22" data-role="header-band" data-parent="__legend-swatch-1" fill="#FFF1C9" stroke="none" />
  <text x="82" y="768" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-1">池：拥有自身流程的参与方</text>
  <rect x="473" y="750" width="42" height="24" data-role="legend-zone" data-id="__legend-swatch-2" data-band-axis="x" fill="#F7F7F7" stroke="#666A73" stroke-width="1.6" rx="10" />
  <rect x="474" y="751" width="10" height="22" data-role="header-band" data-parent="__legend-swatch-2" fill="#EDEDED" stroke="none" />
  <text x="527" y="768" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-2">黑盒池（外部参与方）</text>
  <circle cx="939" cy="762" r="11" data-role="legend-swatch" data-id="__legend-swatch-3" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" />
  <text x="972" y="768" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-3">开始事件</text>
  <rect x="28" y="792" width="42" height="24" data-role="legend-swatch" data-id="__legend-swatch-4" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="14" />
  <text x="82" y="810" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-4">任务（动词 + 对象）</text>
  <polygon points="494,792 515,804 494,816 473,804" data-role="legend-swatch" data-id="__legend-swatch-5" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" />
  <text x="527" y="810" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-5">排他网关（问题）</text>
  <circle cx="939" cy="804" r="11" data-role="legend-swatch" data-id="__legend-swatch-6" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="4" />
  <text x="972" y="810" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-6">结束事件（每种结果一个）</text>
  <polyline points="28,845 70,845" data-role="edge" data-kind="legend" data-id="legend-line-7" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="82" y="852" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-7">顺序流（池内）</text>
  <polyline points="473,845 515,845" data-role="edge" data-kind="legend" data-id="legend-line-8" fill="none" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#msg-start)" marker-end="url(#msg-end)" />
  <text x="527" y="852" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-8">消息流（池之间）</text>
</svg>
