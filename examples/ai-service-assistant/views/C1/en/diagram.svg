  <text x="774" y="420" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-doc" data-role="sub">X-doc · HTTPS connector</text>
  <text x="774" y="443" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-doc" data-role="sub">Source documents and access policy</text>
  <rect x="760" y="530" width="400" height="108" data-role="node" data-id="X-desk" data-kind="external" data-parent="G-ent" fill="#EDEDED" stroke="#666A73" stroke-width="1.8" rx="0" />
  <text x="774" y="559" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="X-desk" data-role="name">Service Desk</text>
  <text x="774" y="584" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-desk" data-role="sub">X-desk · HTTPS</text>
  <text x="774" y="607" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-desk" data-role="sub">Catalogue, ticket read and create</text>
  <rect x="760" y="790" width="400" height="108" data-role="node" data-id="X-model" data-kind="external" data-parent="G-cloud" fill="#EDEDED" stroke="#666A73" stroke-width="1.8" rx="0" />
  <text x="774" y="819" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="X-model" data-role="name">Managed Model Service</text>
  <text x="774" y="844" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-model" data-role="sub">X-model · Amazon Bedrock</text>
  <text x="774" y="867" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-model" data-role="sub">Generate text and embeddings</text>
  <polyline points="420,366 500,366 500,284 760,284" data-role="edge" data-id="APP-1" data-from="S-assistant" data-to="X-idp" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="515.0" y="254.0" width="154.859375" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-APP-1" data-parent="APP-1" />
  <text x="520" y="274" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" data-owner="APP-1" data-role="edge-label">identity, delegation</text>
  <polyline points="420,420 760,420" data-role="edge" data-id="APP-2" data-from="S-assistant" data-to="X-doc" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="515.0" y="390.0" width="138.921875" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-APP-2" data-parent="APP-2" />
  <text x="520" y="410" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" data-owner="APP-2" data-role="edge-label">documents, ACLs</text>
  <polyline points="420,474 500,474 500,584 760,584" data-role="edge" data-id="APP-3" data-from="S-assistant" data-to="X-desk" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="515.0" y="554.0" width="58.609375" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-APP-3" data-parent="APP-3" />
  <text x="520" y="574" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" data-owner="APP-3" data-role="edge-label">tickets</text>
  <polyline points="250,510 250,844 760,844" data-role="edge" data-id="APP-4" data-from="S-assistant" data-to="X-model" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="295.0" y="814.0" width="141.25" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-APP-4" data-parent="APP-4" />
  <text x="300" y="834" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" data-owner="APP-4" data-role="edge-label">text, embeddings</text>
  <rect x="28" y="975" width="42" height="22" data-role="legend-zone" data-id="__legend-swatch-1" fill="#F3F8FF" stroke="#3D6FB2" stroke-width="1.6" rx="10" />
  <text x="82" y="992" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-1">New application (owned by this design)</text>
  <rect x="473" y="975" width="42" height="22" data-role="legend-zone" data-id="__legend-swatch-2" fill="#FFF9EC" stroke="#A8741A" stroke-width="1.6" rx="10" />
  <text x="527" y="992" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-2">Existing enterprise systems</text>
  <rect x="918" y="975" width="42" height="22" data-role="legend-zone" data-id="__legend-swatch-3" fill="#F1F9F3" stroke="#2F7D4F" stroke-width="1.6" rx="10" />
