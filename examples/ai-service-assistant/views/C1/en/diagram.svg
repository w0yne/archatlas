  <rect x="28" y="1020" width="42" height="22" data-role="legend-swatch" data-id="__legend-swatch-4" fill="#1767B5" stroke="#03172E" stroke-width="2.4" rx="8" />
  <text x="82" y="1037" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-4">Subject</text>
  <rect x="473" y="1020" width="42" height="22" data-role="legend-swatch" data-id="__legend-swatch-5" fill="#EDEDED" stroke="#666A73" stroke-width="1.8" rx="0" />
  <text x="527" y="1037" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-5">External party</text>
  <polyline points="918,1030 960,1030" data-role="edge" data-kind="legend" data-id="legend-line-6" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="972" y="1037" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-6">Initiator → dependency</text>
