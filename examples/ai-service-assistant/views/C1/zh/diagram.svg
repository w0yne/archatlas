  <polyline points="420,420 760,420" data-role="edge" data-id="APP-2" data-from="S-assistant" data-to="X-doc" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="515.0" y="390.0" width="122.0" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-APP-2" data-parent="APP-2" />
  <text x="520" y="410" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" data-owner="APP-2" data-role="edge-label">文档、访问规则</text>
  <polyline points="420,474 500,474 500,584 760,584" data-role="edge" data-id="APP-3" data-from="S-assistant" data-to="X-desk" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="515.0" y="554.0" width="42.0" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-APP-3" data-parent="APP-3" />
  <text x="520" y="574" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" data-owner="APP-3" data-role="edge-label">工单</text>
  <polyline points="250,510 250,844 760,844" data-role="edge" data-id="APP-4" data-from="S-assistant" data-to="X-model" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="295.0" y="814.0" width="90.0" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-APP-4" data-parent="APP-4" />
  <text x="300" y="834" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" data-owner="APP-4" data-role="edge-label">文本、向量</text>
