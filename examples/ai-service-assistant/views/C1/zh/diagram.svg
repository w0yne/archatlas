<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1090" lang="zh" data-archatlas="0.1">
  <title>C1 · 企业服务助手 — 应用景观</title>
  <desc>虚构教学设计，场景版本2；补充参数为示意假设。虚构目标设计 · 一个新应用及其依赖的四个现有系统</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4B5563" />
    </marker>
  </defs>
  <rect data-role="canvas" width="1400" height="1090" fill="#ffffff" />
  <text x="28" y="40" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#1F2937">C1 · 企业服务助手 — 应用景观</text>
  <text x="28" y="72" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937">虚构目标设计 · 一个新应用及其依赖的四个现有系统</text>
  <text x="40" y="112" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#1F2937">范围：本助手及其调用的系统，按归属分组。箭头：调用方 → 依赖方。内部结构见 C3。</text>
  <rect x="40" y="250" width="420" height="330" data-role="group" data-id="G-new" data-kind="boundary" fill="#F3F8FF" stroke="#3D6FB2" stroke-width="1.6" rx="10" />
  <text x="58" y="282" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937" data-owner="G-new" data-role="group-title">新建 · 企业服务助手</text>
  <rect x="720" y="170" width="640" height="520" data-role="group" data-id="G-ent" data-kind="boundary" fill="#FFF9EC" stroke="#A8741A" stroke-width="1.6" rx="10" />
  <text x="738" y="202" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937" data-owner="G-ent" data-role="group-title">现有 · 企业运营的系统</text>
  <rect x="720" y="730" width="640" height="190" data-role="group" data-id="G-cloud" data-kind="boundary" fill="#F1F9F3" stroke="#2F7D4F" stroke-width="1.6" rx="10" />
  <text x="738" y="762" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937" data-owner="G-cloud" data-role="group-title">托管 · 云服务</text>
  <rect x="80" y="330" width="340" height="180" data-role="node" data-id="S-assistant" data-kind="system" data-parent="G-new" fill="#1767B5" stroke="#03172E" stroke-width="2.4" rx="8" />
  <text x="94" y="359" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#ffffff" data-owner="S-assistant" data-role="name">企业服务助手</text>
  <text x="94" y="384" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#ffffff" data-owner="S-assistant" data-role="sub">S-assistant · 新应用</text>
  <text x="94" y="407" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#ffffff" data-owner="S-assistant" data-role="sub">有据可查的回答与经审批的服务操作</text>
  <rect x="760" y="230" width="400" height="108" data-role="node" data-id="X-idp" data-kind="external" data-parent="G-ent" fill="#EDEDED" stroke="#666A73" stroke-width="1.8" rx="0" />
  <text x="774" y="259" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="X-idp" data-role="name">企业 IdP / AS</text>
  <text x="774" y="284" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-idp" data-role="sub">X-idp · OIDC / OAuth</text>
  <text x="774" y="307" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-idp" data-role="sub">身份与受限委托</text>
  <rect x="760" y="366" width="400" height="108" data-role="node" data-id="X-doc" data-kind="external" data-parent="G-ent" fill="#EDEDED" stroke="#666A73" stroke-width="1.8" rx="0" />
