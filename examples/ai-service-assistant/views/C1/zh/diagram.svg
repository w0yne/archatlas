  <text x="774" y="420" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-doc" data-role="sub">X-doc · HTTPS 连接器</text>
  <text x="774" y="443" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-doc" data-role="sub">原始文档与访问策略</text>
  <rect x="760" y="530" width="400" height="108" data-role="node" data-id="X-desk" data-kind="external" data-parent="G-ent" fill="#EDEDED" stroke="#666A73" stroke-width="1.8" rx="0" />
  <text x="774" y="559" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="X-desk" data-role="name">服务工单系统</text>
  <text x="774" y="584" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-desk" data-role="sub">X-desk · HTTPS</text>
  <text x="774" y="607" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-desk" data-role="sub">服务目录、工单读取与创建</text>
  <rect x="760" y="790" width="400" height="108" data-role="node" data-id="X-model" data-kind="external" data-parent="G-cloud" fill="#EDEDED" stroke="#666A73" stroke-width="1.8" rx="0" />
  <text x="774" y="819" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="X-model" data-role="name">托管模型服务</text>
  <text x="774" y="844" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-model" data-role="sub">X-model · Amazon Bedrock</text>
  <text x="774" y="867" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="X-model" data-role="sub">生成文本与向量</text>
