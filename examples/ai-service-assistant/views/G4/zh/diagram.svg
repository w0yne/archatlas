  <polyline points="450,1085 560,1085" data-role="edge" data-id="DEL-7" data-from="AWS-ops" data-to="G4-recover" data-kind="dependency" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 4" />
  <rect x="440.0" y="980.0" width="42.0" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-DEL-7" data-parent="DEL-7" />
