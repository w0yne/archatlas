  <polyline points="220,870 220,1030" data-role="edge" data-id="DEL-6" data-from="C-agent" data-to="AWS-ops" data-kind="data" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
