  <polyline points="925,230 1110,230" data-role="edge" data-id="DEL-2" data-from="C-eval" data-to="G4-gate" data-kind="data" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="925.0" y="185.0" width="74.0" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-DEL-2" data-parent="DEL-2" />
  <text x="930" y="205" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" data-owner="DEL-2" data-role="edge-label">评测结果</text>
  <polyline points="1315,290 1315,510" data-role="edge" data-id="DEL-3" data-from="G4-gate" data-to="G4-hold" data-kind="dependency" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 4" />
  <rect x="1330.0" y="390.0" width="84.53125" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-DEL-3" data-parent="DEL-3" />
  <text x="1335" y="410" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" data-owner="DEL-3" data-role="edge-label">[门禁失败]</text>
  <polyline points="1200,290 1200,410 1000,410 1000,815 925,815" data-role="edge" data-id="DEL-4" data-from="G4-gate" data-to="G4-release" data-kind="dependency" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 4" />
  <rect x="1005.0" y="660.0" width="136.6875" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-DEL-4" data-parent="DEL-4" />
