  <text x="28" y="1190" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">S3 versionId + SHA-256；同摘要经预发布到生产 5%/10分钟灰度；失败恢复兼容指针，不自动回滚数据库。</text>
