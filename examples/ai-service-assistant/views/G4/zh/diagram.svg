<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" lang="zh" data-archatlas="0.1">
  <title>G4 · Prompt/模型配置 — 晋级门禁</title>
  <desc>虚构教学设计，场景版本2；补充参数为示意假设。示意：版本包评测 → 管理员批准 → 运维自动化晋级；生产工具写入与评测身份分离。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4B5563" />
    </marker>
  </defs>
  <rect data-role="canvas" width="1600" height="1320" fill="#ffffff" />
  <text x="28" y="40" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#1F2937">G4 · Prompt/模型配置 — 晋级门禁</text>
  <text x="28" y="72" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937">示意：版本包评测 → 管理员批准 → 运维自动化晋级；生产工具写入与评测身份分离。</text>
  <rect x="40" y="170" width="365" height="120" data-role="node" data-id="DS-eval" data-kind="store" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8" />
  <text x="54" y="199" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="DS-eval" data-role="name">评测数据集</text>
  <text x="54" y="224" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="DS-eval" data-role="sub">版本化 prompt / 模型 / 数据集</text>
  <rect x="560" y="170" width="365" height="120" data-role="node" data-id="C-eval" data-kind="container" fill="#1767B5" stroke="#03172E" stroke-width="2.4" rx="8" />
  <text x="574" y="199" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#ffffff" data-owner="C-eval" data-role="name">评测任务</text>
  <text x="574" y="224" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#ffffff" data-owner="C-eval" data-role="sub">评测专用身份</text>
  <text x="574" y="247" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#ffffff" data-owner="C-eval" data-role="sub">不可写生产工具</text>
  <rect x="1110" y="170" width="410" height="120" data-role="node" data-id="G4-gate" data-kind="task" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8" />
  <text x="1124" y="199" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="G4-gate" data-role="name">质量 / 安全门禁</text>
  <text x="1124" y="224" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="G4-gate" data-role="sub">p95 ≤8秒 · 成本 ≤$0.02</text>
  <text x="1124" y="247" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="G4-gate" data-role="sub">质量 ≥0.85 · 严重安全问题 =0</text>
  <rect x="1110" y="510" width="410" height="100" data-role="node" data-id="G4-hold" data-kind="task" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8" />
  <text x="1124" y="539" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="G4-hold" data-role="name">暂停候选晋级</text>
  <rect x="560" y="760" width="365" height="110" data-role="node" data-id="G4-release" data-kind="task" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8" />
  <text x="574" y="789" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="G4-release" data-role="name">按摘要批准发布</text>
  <text x="574" y="814" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="G4-release" data-role="sub">知识管理员 A / 运维员 R</text>
  <rect x="40" y="760" width="365" height="110" data-role="node" data-id="C-agent" data-kind="container" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8" />
  <text x="54" y="789" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="C-agent" data-role="name">Agent 服务</text>
  <text x="54" y="814" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="C-agent" data-role="sub">生产目标</text>
  <rect x="40" y="1030" width="410" height="110" data-role="node" data-id="AWS-ops" data-kind="component" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8" />
  <text x="54" y="1059" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="AWS-ops" data-role="name">CloudWatch · KMS · Secrets</text>
  <text x="54" y="1084" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="AWS-ops" data-role="sub">CloudWatch 健康 / token 成本</text>
  <rect x="560" y="1030" width="365" height="110" data-role="node" data-id="G4-recover" data-kind="task" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8" />
