  <text x="574" y="1084" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="G4-recover" data-role="sub">停止灰度 / 恢复兼容配置</text>
