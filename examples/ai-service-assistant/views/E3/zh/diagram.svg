<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1230" lang="zh" data-archatlas="0.1">
<title>E3 · 工具请求的条件 — 状态机</title>
<desc>虚构目标设计 · DS-app 中的单个请求；概念条件，不声称已有状态枚举</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect data-role="canvas" width="1400" height="1230" fill="#ffffff"/>
<text x="28" y="40" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#1F2937">E3 · 工具请求的条件 — 状态机</text>
<text x="28" y="72" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937">虚构目标设计 · DS-app 中的单个请求；概念条件，不声称已有状态枚举</text>
<circle cx="110" cy="225" r="15" data-role="node" data-id="E3-start" data-kind="initial" fill="#1F2937" stroke="#1F2937" stroke-width="1.8"/>
<rect x="210" y="175" width="280" height="100" data-role="node" data-id="E3-unapproved" data-kind="state" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8"/>
<text x="224" y="204" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="E3-unapproved" data-role="name">未获审批</text>
<rect x="620" y="175" width="280" height="100" data-role="node" data-id="E3-approved" data-kind="state" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8"/>
<text x="634" y="204" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="E3-approved" data-role="name">已审批</text>
<rect x="1040" y="175" width="280" height="100" data-role="node" data-id="E3-executing" data-kind="state" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8"/>
<text x="1054" y="204" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="E3-executing" data-role="name">执行中</text>
<rect x="1040" y="530" width="280" height="100" data-role="node" data-id="E3-unknown" data-kind="state" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8"/>
<text x="1054" y="559" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="E3-unknown" data-role="name">结果未知</text>
<rect x="620" y="835" width="280" height="100" data-role="node" data-id="E3-resolved" data-kind="state" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8"/>
<text x="634" y="864" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="E3-resolved" data-role="name">结果已记录</text>
<rect x="210" y="530" width="280" height="100" data-role="node" data-id="E3-refused" data-kind="state" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8"/>
<text x="224" y="559" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="E3-refused" data-role="name">已拒绝</text>
<g data-role="node" data-id="E3-final" data-kind="final" fill="#1F2937" stroke="#1F2937" stroke-width="1.8"><circle cx="350" cy="880" r="15" fill="#ffffff" stroke="#1F2937" stroke-width="1.8"/><circle cx="350" cy="880" r="9" fill="#1F2937"/></g>
<polyline points="125,225 210,225" data-role="edge" data-id="STATE-1" data-from="E3-start" data-to="E3-unapproved" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="490,225 620,225" data-role="edge" data-id="STATE-2" data-from="E3-unapproved" data-to="E3-approved" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
