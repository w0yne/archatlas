  <text x="99" y="977" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="AWS-aurora" data-role="sub">服务管理的存储跨 3 个 AZ</text>
