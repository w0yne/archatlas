  <text x="99" y="740" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#ffffff" data-owner="AWS-tasks" data-role="sub">已认证 HTTPS；逐服务 IAM 角色</text>
  <rect x="85" y="1130" width="650" height="100" data-role="node" data-id="AWS-batch" data-kind="component" data-parent="VPC" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8" />
