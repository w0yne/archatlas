<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1530" lang="zh" data-archatlas="0.1">
  <title>G1 / G2 · 企业服务助手的 AWS 部署</title>
  <desc>虚构教学设计，场景版本2；补充参数为示意假设。虚构目标设计 · 单个支持所需服务的区域；应用服务跨 AZ-A + AZ-B</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4B5563" />
    </marker>
  </defs>
  <rect data-role="canvas" width="1400" height="1530" fill="#ffffff" />
  <text x="28" y="40" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#1F2937">G1 / G2 · 企业服务助手的 AWS 部署</text>
  <text x="28" y="72" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937">虚构目标设计 · 单个支持所需服务的区域；应用服务跨 AZ-A + AZ-B</text>
  <rect x="490" y="115" width="365" height="105" data-role="node" data-id="AWS-edge" data-kind="component" fill="#EDEDED" stroke="#666A73" stroke-width="1.8" rx="8" />
  <text x="504" y="144" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="AWS-edge" data-role="name">CloudFront + S3</text>
  <text x="504" y="169" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="AWS-edge" data-role="sub">C-web 静态资源；全球边缘</text>
