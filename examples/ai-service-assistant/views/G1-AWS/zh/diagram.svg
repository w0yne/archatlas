  <text x="504" y="954" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="AWS-search" data-role="sub">DS-index · 双 AZ 副本</text>
  <text x="504" y="977" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="AWS-search" data-role="sub">区域感知；非 Standby 模式</text>
