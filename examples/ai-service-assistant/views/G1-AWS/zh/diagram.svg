  <text x="99" y="1184" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="AWS-batch" data-role="sub">C-ingest · C-eval / 独立任务身份</text>
  <text x="99" y="1207" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="AWS-batch" data-role="sub">调度至任一 AZ；不代表并发重复任务</text>
