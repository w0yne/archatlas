  <text x="99" y="694" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#ffffff" data-owner="AWS-tasks" data-role="sub">C-api · C-agent · C-tools / 独立 ECS 服务</text>
