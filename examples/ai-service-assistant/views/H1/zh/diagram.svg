<text x="28" y="845" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">R = 共享事实明确的执行角色。A = 最终负责；C = 提供意见；I = 接收通知。</text>
<text x="28" y="885" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">? = 未指派 / 未确认，不是“无参与”。每行的 A、C、I 指派均有缺口。</text>
<text x="28" y="925" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">未声称任何一行治理责任已完整；A 不授予数据面权限，也不替代工具审批。</text>
<text x="28" y="965" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">R 来源：R-employee、R-steward、R-operator 与 I-bounds/I-eval/I-operator；待正式责任人确认。</text>
