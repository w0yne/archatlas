<text x="28" y="925" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">No row is claimed governance-complete. A does not grant data-plane access or replace tool approval.</text>
<text x="28" y="965" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">R sources: R-employee, R-steward, R-operator; I-bounds, I-eval, I-operator. Confirm with accountable owners.</text>
