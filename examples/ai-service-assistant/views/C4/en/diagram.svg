  <text x="40" y="112" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#1F2937">Scope: one container. Answer path above, ticket-draft path below; token delivery to the gateway: F1.</text>
