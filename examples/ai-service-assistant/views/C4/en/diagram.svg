<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" lang="en" data-archatlas="0.1">
  <title>C4 · Component diagram for Agent Service in Enterprise Service Assistant</title>
  <desc>Fictional teaching design, scenario version 2; additional parameters are illustrative assumptions. Illustrative component boundaries · Module names in AS-components; not an existing implementation claim.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4B5563" />
