<text x="564" y="527" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="P-compose" data-role="sub">提示词、模型调用、guardrails</text>
<rect x="550" y="670" width="380" height="108" data-role="node" data-id="P-plan" data-kind="component" data-parent="B-agent" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8"/>
<text x="564" y="699" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="P-plan" data-role="name">1. 起草请求</text>
