<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" lang="zh" data-archatlas="0.1">
<title>C4 · 企业服务助手中 Agent 服务的组件图</title>
<desc>虚构目标设计 · 组件即该服务的职责步骤；代码模块名不在此固定</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect data-role="canvas" width="1400" height="1040" fill="#ffffff"/>
<text x="28" y="40" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#1F2937">C4 · 企业服务助手中 Agent 服务的组件图</text>
<text x="28" y="72" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937">虚构目标设计 · 组件即该服务的职责步骤；代码模块名不在此固定</text>
<text x="40" y="112" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#1F2937">范围：单个容器。上方为回答路径，下方为工单草稿路径；令牌下发给网关见 F1。</text>
<rect x="520" y="170" width="440" height="710" data-role="group" data-id="B-agent" data-kind="boundary" fill="#F3F8FF" stroke="#3D6FB2" stroke-width="1.6" rx="10"/>
<text x="538" y="202" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937" data-owner="B-agent" data-role="group-title">Agent 服务 · 组件</text>
<rect x="40" y="250" width="270" height="108" data-role="node" data-id="C-api" data-kind="container" fill="#FFFFFF" stroke="#3D6FB2" stroke-width="1.8" rx="8"/>
<text x="54" y="279" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="C-api" data-role="name">应用 API/BFF</text>
<text x="54" y="304" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="C-api" data-role="sub">C-api · Python / HTTPS</text>
<text x="54" y="327" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="C-api" data-role="sub">会话、租户策略与审批</text>
<rect x="550" y="250" width="380" height="108" data-role="node" data-id="P-retrieve" data-kind="component" data-parent="B-agent" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8"/>
<text x="564" y="279" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="P-retrieve" data-role="name">2. 授权检索</text>
<text x="564" y="304" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="P-retrieve" data-role="sub">P-retrieve · 组件</text>
<text x="564" y="327" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937" data-owner="P-retrieve" data-role="sub">检索前执行租户与 ACL 过滤</text>
<rect x="550" y="450" width="380" height="108" data-role="node" data-id="P-compose" data-kind="component" data-parent="B-agent" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8"/>
<text x="564" y="479" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#1F2937" data-owner="P-compose" data-role="name">3. 生成回答</text>
