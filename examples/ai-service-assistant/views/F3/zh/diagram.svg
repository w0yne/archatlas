  <text x="28" y="620" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">K = 已验证 tenant + 当前 ACL；访问引用时再次检查。</text>
  <text x="28" y="662" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">M = 本租户知识/ACL 维护。W = 本人许可草稿 + 绑定审批 + 执行前再授权。</text>
  <text x="28" y="704" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">E = 管理员批准的去标识/合成数据导出。T = 仅脱敏健康信息。</text>
  <text x="28" y="746" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">D = 本角色不授予。显式授权取并集，再与当前范围约束相交；拒绝优先，错误默认拒绝。</text>
  <text x="28" y="788" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">允许：员工 + tenant-amber + 匹配 ACL → 引用知识。拒绝：仅运维角色 → 租户内容。</text>
  <text x="28" y="830" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">工具执行：C-tools 核验 AS 证明、actor、tenant/scopes、当前策略与准确审批绑定。</text>
  <text x="28" y="872" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">示意策略 AS-policy：管理员读取也必须满足本租户 ACL；角色组合不提升资源范围。</text>
</svg>
