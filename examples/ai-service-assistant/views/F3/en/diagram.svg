  <text x="28" y="620" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">K = verified tenant + current ACL; recheck again on citation access.</text>
  <text x="28" y="662" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">M = own-tenant knowledge/ACL maintenance. W = own permitted draft + bound approval + fresh authorization.</text>
  <text x="28" y="704" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">E = steward-approved deidentified/synthetic export. T = redacted health only.</text>
  <text x="28" y="746" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">D = no role grant. Union explicit grants; intersect current scope constraints. Policy denial wins; errors deny.</text>
  <text x="28" y="788" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">Allowed: employee + tenant-amber + matching ACL → cited knowledge. Denied: operator role alone → tenant content.</text>
  <text x="28" y="830" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">Tool execution: C-tools validates AS proof, actor, tenant/scopes, current policy and exact approval binding.</text>
  <text x="28" y="872" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">Illustrative AS-policy: steward reads also require current tenant ACL; combining roles never widens resource scope.</text>
</svg>
