  <rect x="1240.0" y="1034.0" width="56.609375" height="27.599999999999998" fill="#ffffff" data-role="label-bg" data-id="label-HO-8" data-parent="HO-8" />
  <text x="1245" y="1052" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-owner="HO-8" data-role="edge-label">工单 ID</text>
  <polyline points="1028.5,855 1235,855 1235,950" data-role="edge" data-id="HO-9" data-from="G-checks" data-to="P-create" data-kind="message" fill="none" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#msg-end)" />
  <rect x="1036.5" y="827.0" width="123.296875" height="27.599999999999998" fill="#ffffff" data-role="label-bg" data-id="label-HO-9" data-parent="HO-9" />
  <text x="1041.5" y="845" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-owner="HO-9" data-role="edge-label">是：创建 + 幂等键</text>
  <text x="25" y="1190" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#1F2937">token 交换对象为企业 IdP / AS（见 F1）。工单系统使用独立受限连接器凭据，绝不转发 token。</text>
