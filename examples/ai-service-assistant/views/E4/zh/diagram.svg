  <polyline points="779.5,643 933.5,643 933.5,710" data-role="edge" data-id="HO-5" data-from="P-exchange" data-to="P-execute" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="781.5" y="615.0" width="141.078125" height="27.599999999999998" fill="#ffffff" data-role="label-bg" data-id="label-HO-5" data-parent="HO-5" />
  <text x="786.5" y="633" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-owner="HO-5" data-role="edge-label">工具 token + 审批 ID</text>
