  <rect x="28" y="1257" width="42" height="24" data-role="legend-swatch" data-id="__legend-swatch-4" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" rx="8" />
  <text x="82" y="1275" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#1F2937" data-role="legend" data-id="legend-4">步骤（位于执行者泳道）</text>
  <polygon points="494,1257 515,1269 494,1281 473,1269" data-role="legend-swatch" data-id="__legend-swatch-5" fill="#D8E8FF" stroke="#3D6FB2" stroke-width="1.8" />
