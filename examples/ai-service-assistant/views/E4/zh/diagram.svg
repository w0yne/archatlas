  <text x="674.5" y="648" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle" data-owner="P-exchange" data-role="name">换取工具 token</text>
