  <text x="933.5" y="748" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle" data-owner="P-execute" data-role="name">3. 工具再授权</text>
