<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1350" lang="zh" data-archatlas="0.1">
  <title>E4 · 创建经审批的工单 — 每步由谁执行、传递什么</title>
  <desc>虚构教学设计，场景版本2；补充参数为示意假设。虚构目标设计 · 系统泳道，主路径加拒绝出口 · token 细节见 F1，消息顺序见 E1</desc>
