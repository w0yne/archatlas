<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1250" lang="zh" data-archatlas="0.1">
<title>G3 · 工单写入 — 所需逻辑网络连接</title>
<desc>虚构目标设计 · 连通意图，不代表已验证路由或防火墙许可</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect data-role="canvas" width="1600" height="1250" fill="#ffffff"/>
