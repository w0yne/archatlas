<polyline points="650,775 650,985" data-role="edge" data-id="NET-5" data-from="C-tools" data-to="X-desk" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="675" y="915" width="132.328125" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-NET-5" data-parent="NET-5"/>
<text x="680" y="935" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" data-owner="NET-5" data-role="edge-label">5 · 连接器 HTTPS</text>
<polyline points="1310,775 1310,985" data-role="edge" data-id="NET-6" data-from="C-agent" data-to="X-idp" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1065" y="915" width="191.96875" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-NET-6" data-parent="NET-6"/>
<text x="1070" y="935" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" data-owner="NET-6" data-role="edge-label">token exchange / HTTPS</text>
<text x="28" y="410" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">尚未冻结：地址、监听端口、DNS、路由表、安全组/过滤规则与出站机制。</text>
<text x="28" y="450" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">应答需要可用的返回路径；不从“私有”名称或箭头推断返回路由。</text>
<text x="28" y="510" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">部署前选择并验证端点 / 出站路由；本图不新增 NAT、对等连接或代理。</text>
