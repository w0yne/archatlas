<text x="28" y="72" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937">虚构目标设计 · 连通意图，不代表已验证路由或防火墙许可</text>
<rect x="420" y="120" width="1140" height="730" data-role="group" data-id="NET-app" data-kind="boundary" fill="#F3F8FF" stroke="#3D6FB2" stroke-width="1.6" rx="10"/>
