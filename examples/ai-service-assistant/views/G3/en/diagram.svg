  <polyline points="650,775 650,985" data-role="edge" data-id="NET-5" data-from="C-tools" data-to="X-desk" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="675.0" y="915.0" width="162.703125" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-NET-5" data-parent="NET-5" />
