<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1250" lang="en" data-archatlas="0.1">
  <title>G3 · Ticket write — required logical connectivity</title>
  <desc>Fictional teaching design, scenario version 2; additional parameters are illustrative assumptions. Illustrative network contract · Logical reachability; transit in AS-network, not observed traffic.</desc>
