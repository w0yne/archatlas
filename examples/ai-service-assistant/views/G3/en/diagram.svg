  <polyline points="1310,775 1310,985" data-role="edge" data-id="NET-6" data-from="C-agent" data-to="X-idp" data-kind="call" fill="none" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="1065.0" y="915.0" width="193.953125" height="30.4" fill="#ffffff" data-role="label-bg" data-id="label-NET-6" data-parent="NET-6" />
  <text x="1070" y="935" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" data-owner="NET-6" data-role="edge-label">Token exchange / HTTPS</text>
  <text x="28" y="410" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">TLS/443; RFC5737 192.0.2/24: public .0/.32, app .64/.96, data .128/.160 (all /27; diagram only).</text>
  <text x="28" y="450" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">Ingress via CloudFront/ALB; AS/Desk egress via same-AZ NAT; S3 gateway and managed-service private endpoints.</text>
  <text x="28" y="510" font-family="Noto Sans, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937">Service SG allowlists + workload mTLS; VPC DNS; stateful returns and matching NACLs; tasks have no public IP.</text>
